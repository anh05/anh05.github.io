- id: mycobase-website
  name: MycoBase website
  description: Project website for MycoBase, an NWO-funded open science infrastructure that brings fungal data together in one searchable, FAIR platform. Astro static site with Decap CMS so scientists can publish without Git, GitHub OAuth for editors, and CI/CD with GitHub Actions to a SURF Research Cloud VM (nginx, HTTPS).
  role: Sole developer of the website
  tags: [Astro, Decap CMS, GitHub Actions, SURF Research Cloud, nginx]
  url: https://mycobase.org
  featured: true
  order: 1

- id: xautoml
  name: xAutoML
  description: Self-initiated platform that guides non-experts from a raw dataset to a tuned, explainable ML model. Flask, MySQL/SQLAlchemy and an AutoML back end built on DACOpt/BO4ML, deployed with Docker Compose, GitHub Actions and Cloudflare Tunnel.
  role: Sole developer
  status: In active development
  tags: [Python, Flask, MySQL, Docker, GitHub Actions]
  caseStudy: /projects/xautoml/
  featured: true
  order: 2

- id: dacopt
  name: DACOpt
  description: Open-source Python package implementing an efficient contesting procedure for AutoML optimization (combined algorithm selection and hyperparameter tuning), with documentation and reproducible experiments.
  tags: [Python, AutoML, Hyperparameter optimization]
  repo: https://github.com/ECOLE-ITN/NguyenIEEEAccess2022
  package: https://pypi.org/project/DACOpt/
